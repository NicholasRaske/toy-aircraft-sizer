[project]
name = "aerosizer"
version = "0.1.0"
description = "Modular RC aircraft configuration advisor"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 is not in ruff's default set, so a configured line-length is otherwise
# never enforced.
select = ["E", "F", "I", "W", "RUF"]
